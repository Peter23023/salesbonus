<style>

  button { height: 52px; border: 0; border-radius: 16px; background: var(--purple); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--purple); outline-offset: 2px; }

</style>

const KEY_STORE = "sales-bonus-web-key";
const en = !/^(nb|no|nn)\b/i.test(navigator.language || "");
if (en) {
  document.documentElement.lang = "en";
  document.getElementById("d").textContent = "Type the password you got from your team.";
  document.getElementById("go").textContent = "Open";
}
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
async function decrypt(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(IV) }, key, bytes(DATA));
  return new TextDecoder().decode(plain);
}
// Replace the whole page with the app, but only once this page has finished loading
// (document.open() while the page is still loading would append instead of replace).
function show(html) {
  const go = () => { document.open(); document.write(html); document.close(); };
  if (document.readyState === "complete") go(); else window.addEventListener("load", go, { once: true });
}
async function keyFromPassword(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw.trim().toLowerCase().normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(SALT), iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY_STORE); } catch (e) {}
  if (saved) {
    try {
      const key = await crypto.subtle.importKey("raw", bytes(saved), "AES-GCM", true, ["decrypt"]);
      show(await decrypt(key));
      return;
    } catch (e) { try { localStorage.removeItem(KEY_STORE); } catch (e2) {} }  // password changed since
  }
  const form = document.getElementById("lock"), err = document.getElementById("err"), go = document.getElementById("go");
  form.hidden = false;
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const pw = document.getElementById("pw").value;
    if (!pw.trim()) return;
    go.disabled = true; err.textContent = "";
    try {
      const key = await keyFromPassword(pw);
      const html = await decrypt(key);
      try { localStorage.setItem(KEY_STORE, b64(await crypto.subtle.exportKey("raw", key))); } catch (e2) {}
      show(html);
    } catch (e2) {
      err.textContent = en ? "Wrong password. Try again." : "Feil passord. Prøv igjen.";
      go.disabled = false;
    }
  });
})();
